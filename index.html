<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grand Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient"></div>

<header>
  <a class="brand" href="/">
    <b>G</b><span>GRAND MARKET</span>
  </a>
  <a class="adminLink" href="/admin">Admin</a>
</header>

<section class="hero">
  <div class="pill">✦ COMMUNITY MARKETPLACE</div>
  <h1>Buy. Sell. <span>Discover.</span></h1>
  <p>Simple product listings with direct seller contact. No checkout. No clutter.</p>
  <a href="#list" class="heroBtn">Explore Listings <span>↓</span></a>
</section>

<main>
<section class="formCard">
  <div class="sectionHead">
    <div>
      <div class="eyebrow">SELL SOMETHING</div>
      <h2>Create a listing</h2>
      <p>Submit your product and wait for admin approval.</p>
    </div>
    <div class="miniIcon">＋</div>
  </div>

  <form id="form">
    <div class="two">
      <input name="name" placeholder="Product name" required>
      <input name="price" type="text" inputmode="text" autocomplete="off"
             placeholder="Price • ₹500 / Negotiable" required>
    </div>

    <textarea name="description" placeholder="Tell buyers about your product..." required></textarea>
    <input name="discord" placeholder="Seller Discord username" required>

    <label class="uploadBox">
      <span class="uploadIcon">＋</span>
      <strong>Choose product images</strong>
      <small>Up to 10 images • JPG, PNG, WEBP • 5MB each</small>
      <input id="images" name="images" type="file" accept="image/*" multiple required>
    </label>

    <div id="preview" class="preview"></div>

    <button class="submitBtn" type="submit">
      Submit for approval <span>→</span>
    </button>
    <p id="msg"></p>
  </form>
</section>

<section id="list">
  <div class="listingHead">
    <div>
      <div class="eyebrow">MARKETPLACE</div>
      <h2>Latest listings</h2>
    </div>
    <input id="search" placeholder="⌕  Search products...">
  </div>

  <p id="status"></p>
  <div id="grid" class="grid"></div>
</section>
</main>

<div id="viewer" class="viewer" aria-hidden="true">
  <button id="closeViewer" class="viewerBtn" aria-label="Close">×</button>
  <button id="prev" class="navBtn left" aria-label="Previous">‹</button>
  <img id="viewerImg" alt="Product image">
  <button id="next" class="navBtn right" aria-label="Next">›</button>
  <div id="counter"></div>
</div>

<script src="app.js"></script>
</body>
</html>
