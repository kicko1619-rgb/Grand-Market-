<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Market</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">GRAND <span>MARKET</span></div><a href="/admin">Admin</a></header>
<section class="hero"><h1>Find it. List it. <span>Grand Market.</span></h1><p>A modern marketplace for listings — no checkout, just products and seller contact.</p></section>
<main><section class="panel"><h2>List your product</h2><form id="form">
<input name="name" placeholder="Product name" required>
<input name="price" type="text" inputmode="text" autocomplete="off" placeholder="Price — e.g. ₹500 or Negotiable" required>
<textarea name="description" placeholder="Product description" required></textarea>
<input name="discord" placeholder="Seller Discord" required>
<label class="file">Choose product images <input id="images" name="images" type="file" accept="image/*" multiple required></label>
<div id="preview" class="preview"></div><button>Submit for approval</button><p id="msg"></p></form></section>
<section><div class="bar"><h2>Latest listings</h2><input id="search" placeholder="Search products..."></div><p id="status"></p><div id="grid" class="grid"></div></section></main>
<script src="app.js"></script></body></html>
